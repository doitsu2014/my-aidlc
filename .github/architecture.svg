<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">dtech-aidlc architecture</title>
  <desc id="d">An AI assistant drives the dtech-aidlc CLI through a shell or the dtech-aidlc-mcp server over MCP stdio. Both share one Rust library: an application facade, the orchestration engine and work-unit evidence checks. The MCP server writes telemetry that the read-only dtech-aidlc monitor serves on 127.0.0.1. All state lives under .aidlc/ in the project; the methodology and harness skills are embedded at build time.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .h{font-size:14px;font-weight:700}
      .s{font-size:12px}
      .l{font-size:11px;fill:#475569}
      .e{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .light .h{fill:#0f172a} .light .s{fill:#334155}
      .dark .h{fill:#f8fafc} .dark .s{fill:#cbd5e1}
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="668" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#0f172a">dtech-aidlc architecture</text>
  <text x="40" y="62" class="s" fill="#64748b">One Rust library, two binaries, everything local under .aidlc/</text>

  <!-- Actors -->
  <g class="light" text-anchor="middle">
    <rect x="40" y="85" width="570" height="50" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="325" y="106" class="h">AI coding assistant</text>
    <text x="325" y="124" class="s">Claude Code · DeepSeek Harness</text>
    <rect x="640" y="85" width="320" height="50" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="800" y="106" class="h">Project owner</text>
    <text x="800" y="124" class="s">browser on the same machine</text>
  </g>

  <!-- Binaries -->
  <g class="dark" text-anchor="middle">
    <rect x="40" y="185" width="260" height="70" rx="10" fill="#1e293b" stroke="#0f172a"/>
    <text x="170" y="210" class="h">dtech-aidlc</text>
    <text x="170" y="228" class="s">CLI, run by the slash-command skill</text>
    <text x="170" y="245" class="s">every command</text>
    <rect x="330" y="185" width="280" height="70" rx="10" fill="#1e293b" stroke="#0f172a"/>
    <text x="470" y="210" class="h">dtech-aidlc-mcp</text>
    <text x="470" y="228" class="s">MCP server · stdio JSON-RPC 2.0</text>
    <text x="470" y="245" class="s">tools: status · queue · next · report</text>
    <rect x="640" y="185" width="320" height="70" rx="10" fill="#1e293b" stroke="#0f172a"/>
    <text x="800" y="210" class="h">dtech-aidlc monitor</text>
    <text x="800" y="228" class="s">HTTP on 127.0.0.1 · per-run token</text>
    <text x="800" y="245" class="s">read-only dashboard</text>
  </g>
  <path class="e" d="M170 135V183"/>
  <text x="178" y="164" class="l">shell</text>
  <path class="e" d="M470 135V183"/>
  <text x="478" y="164" class="l">MCP · stdio</text>
  <path class="e" d="M800 135V183"/>
  <text x="808" y="164" class="l">URL with #token=…</text>

  <!-- Library -->
  <rect x="40" y="285" width="920" height="220" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="56" y="304" font-size="12" font-weight="700" fill="#64748b">rust-cli library (lib.rs)</text>
  <g class="light" text-anchor="middle">
    <rect x="56" y="318" width="244" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="178" y="338" class="h">project setup &amp; reports</text>
    <text x="178" y="355" class="s">onboarding · harness · knowledge</text>
    <text x="178" y="371" class="s">config · deps · status · doctor</text>
    <rect x="316" y="318" width="308" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="470" y="338" class="h">application · shared facade</text>
    <text x="470" y="355" class="s">status · queue · next · report</text>
    <text x="470" y="371" class="s">Caller::Cli | Caller::Mcp</text>
    <rect x="56" y="400" width="284" height="88" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="198" y="425" class="h">orchestration engine</text>
    <text x="198" y="445" class="s">orchestrate · scope · gates</text>
    <text x="198" y="463" class="s">context · prerequisites · identity</text>
    <rect x="356" y="400" width="268" height="88" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="490" y="425" class="h">work units &amp; evidence</text>
    <text x="490" y="445" class="s">work_units · unit_commands</text>
    <text x="490" y="463" class="s">regression · ids · artifacts</text>
    <rect x="656" y="318" width="288" height="170" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="800" y="343" class="h">telemetry</text>
    <text x="800" y="372" class="s" font-weight="700">sink.rs</text>
    <text x="800" y="389" class="s">writer thread · bounded queue</text>
    <text x="800" y="405" class="s">written by MCP only, never the CLI</text>
    <text x="800" y="438" class="s" font-weight="700">query.rs</text>
    <text x="800" y="455" class="s">read-only queries for the monitor</text>
  </g>
  <path class="e" d="M110 255V316"/>
  <path class="e" d="M250 255L360 316"/>
  <path class="e" d="M470 255V316"/>
  <path class="e" d="M600 255L656 340"/>
  <text x="612" y="276" class="l">events</text>
  <path class="e" d="M800 255V316"/>
  <text x="808" y="276" class="l">query</text>
  <path class="e" d="M400 378L300 398"/>
  <path class="e" d="M340 444H354"/>

  <!-- Build-time and disk -->
  <g class="light" text-anchor="middle">
    <rect x="40" y="530" width="340" height="105" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="210" y="555" class="h">embedded at build time (build.rs)</text>
    <text x="210" y="576" class="s">core/: phase graph · methodology · scaffold</text>
    <text x="210" y="594" class="s">harness/: Claude Code · DeepSeek skills</text>
    <text x="210" y="612" class="s">methodology materialized to .aidlc/engine/</text>
    <rect x="420" y="530" width="540" height="105" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="690" y="555" class="h">.aidlc/ in your project</text>
    <text x="690" y="576" class="s">state.json · state.lock · intents/&lt;id&gt;/ · audit.jsonl</text>
    <text x="690" y="594" class="s">knowledge/ · engine/ · shared/ · telemetry/</text>
    <text x="690" y="612" class="s" font-style="italic">atomic writes · state lock · append-only audit</text>
  </g>
  <path class="e" d="M198 530V490"/>
  <text x="206" y="516" class="l">graph + methodology</text>
  <path class="e" d="M490 488L540 528"/>
  <text x="546" y="522" class="l">state · audit · artifacts</text>
  <path class="e" d="M800 488V528"/>
  <text x="808" y="514" class="l">JSONL parts</text>
</svg>
